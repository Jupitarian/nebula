<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Offers Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <header class="dash-header">
            <div class="header-left">
                <h1>Mobile Offers Dashboard</h1>
                <p class="header-sub">Compare wireless plans from Mint Mobile, Visible &amp; Boost Mobile</p>
            </div>
            <div class="header-right">
                <span class="last-updated" id="lastUpdated">Not yet loaded</span>
                <button class="refresh-btn" id="refreshBtn" onclick="refreshOffers()">
                    <svg class="refresh-icon" id="refreshIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                    </svg>
                    <span id="refreshText">Refresh Offers</span>
                </button>
            </div>
        </header>

        <!-- Status bar -->
        <div class="status-bar" id="statusBar" style="display: none;">
            <span class="status-text" id="statusText"></span>
        </div>

        <!-- View toggle -->
        <div class="view-controls">
            <button class="view-btn active" data-view="cards" onclick="setView('cards')">Card View</button>
            <button class="view-btn" data-view="compare" onclick="setView('compare')">Compare Plans</button>
        </div>

        <!-- Card View -->
        <div class="view-panel active" id="cardsView">
            <div class="carriers-grid" id="carriersGrid">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Comparison View -->
        <div class="view-panel" id="compareView">
            <div class="compare-filters">
                <label>
                    <input type="checkbox" checked onchange="filterCompare('mint', this.checked)"> Mint Mobile
                </label>
                <label>
                    <input type="checkbox" checked onchange="filterCompare('visible', this.checked)"> Visible
                </label>
                <label>
                    <input type="checkbox" checked onchange="filterCompare('boost', this.checked)"> Boost Mobile
                </label>
                <span class="sort-label">Sort by:</span>
                <select id="sortSelect" onchange="sortCompare()">
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="carrier">Carrier</option>
                </select>
            </div>
            <div class="compare-table-wrap">
                <table class="compare-table" id="compareTable">
                    <thead>
                        <tr>
                            <th>Carrier</th>
                            <th>Plan</th>
                            <th>Price</th>
                            <th>Data</th>
                            <th>Key Features</th>
                        </tr>
                    </thead>
                    <tbody id="compareBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
